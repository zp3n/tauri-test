<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Low Latency Mic Monitor</title>

    <link rel="stylesheet" href="./style2.css">
</head>

<body>

    <main class="container">

        <h1>🎙 Low Latency Mic Monitor</h1>

        <div class="controls">

            <button id="startButton">
                マイク開始
            </button>

        </div>

        <div id="status">
            停止中
        </div>

        <section class="meter-container">

            <div class="meter">
                <div id="level"></div>
            </div>

            <div id="db">
                -∞ dBFS
            </div>

        </section>

        <section class="info">

            <div>
                <span>Input</span>
                <strong id="inputDevice">
                    Default
                </strong>
            </div>

            <div>
                <span>Output</span>
                <strong id="outputDevice">
                    Default
                </strong>
            </div>

        </section>

    </main>

    <script type="module" src="./audio.js"></script>

</body>
</html>
